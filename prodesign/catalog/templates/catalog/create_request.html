{% extends 'catalog/base_template.html' %}
{% block title %} Создание заявки {% endblock %}
{% block content %}


    <form method="post" enctype="multipart/form-data">
    
            {% csrf_token %}

        {% if error %}
            <div style="color: red; margin-bottom: 20px;">
                {{ error }}
            </div>
        {% endif %}

        <div class="form-group">
            <label for="description">Описание заявки:</label>
            <input type="text" id="description" name="description" required>
        </div>
        
        <div class="form-group">
            <label for="title">Заголовок заявки:</label>
            <input type="text" id="title" name="title" required>
        </div>
        
        <div class="form-group">
            <label for="image">Изображение дизайна:</label>
            <input type="file" id="image" name="image" accept="image/*" required>
            <small>Допустимые форматы: JPG, JPEG, PNG, BMP. Максимальный размер: 2MB</small>
        </div>

        <div class="form-group">
            <label for="categories">Категории:</label>
            <select id="categories" name="category">
                {% for category in list_categories %}
                    <option value="{{ category.id }}">{{category}}</option>
                {% endfor %}
            </select>
        </div>

        <button type="submit">Создать заявку</button>
    </form>
{% endblock %}
