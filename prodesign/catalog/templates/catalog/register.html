{% extends 'catalog/base_template.html' %}
{% block title %} Регистрация {% endblock %}
{% block content %}

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}
    
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <div class="form-group">
            <label for="last_name">Фамилия:</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>

        <div class="form-group">
            <label for="first_name">Имя:</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>

        <div class="form-group">
            <label for="patronymic">Отчество:</label>
            <input type="text" id="patronymic" name="patronymic" required>
        </div>

        <div class="form-group">
            <label for="username">Имя пользователя:</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>
        
        <div class="form-group">
            <label for="password1">Пароль:</label>
            <input type="password" id="password1" name="password1" required>
        </div>
        
        <div class="form-group">
            <label for="password2">Подтвердите пароль:</label>
            <input type="password" id="password2" name="password2" required>
        </div>

        <div>
            <label for="is_moderator">Пользователь - модератор?</label>
            <input type="checkbox" id="is_moderator" name="is_moderator">
        </div>


        <button type="submit">Зарегистрироваться</button>
    </form>
    <p><a href="{% url 'login' %}">Уже есть аккаунт? Войдите</a></p>
{% endblock %}
